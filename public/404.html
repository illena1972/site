<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — BioClean</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 640px);
        padding: 48px 24px;
        text-align: center;
      }

      img {
        width: 160px;
        height: auto;
      }

      h1 {
        margin: 32px 0 12px;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 520px;
        color: #475569;
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 22px;
        border-radius: 12px;
        background: #059669;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/bioclean-logo.png" alt="BioClean Workwear" />
      <h1>Страница не найдена</h1>
      <p>
        Такой страницы нет или адрес изменился. Вернитесь на главную страницу
        BioClean Workwear.
      </p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
